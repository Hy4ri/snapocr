[package]
name = "snapocr"
version = "1.0.0"
edition = "2021"
description = "Zero-dependency Wayland screen OCR to clipboard"

[dependencies]
arboard = { version = "3.6", features = ["wayland-data-control"] }
image = { version = "0.25", default-features = false, features = ["png", "pnm"] }
eframe = { version = "0.36", default-features = false, features = ["glow", "wayland", "default_fonts"] }
libwayshot = { version = "0.9", default-features = false }
